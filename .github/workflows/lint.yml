name: Lint

on:
  push:
    branches:
      - tmp
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=30m
          install-mode: binary
          verify: false
