name: Publish Docker Images

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g., v1.13.0-nekolsd)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Docker image for version: ${VERSION} (tag: ${TAG})"

  build_binary:
    name: Build binary
    if: github.event_name != 'release' || github.event.release.target_commitish != 'oldstable'
    runs-on: ubuntu-latest
    needs: calculate_version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.calculate_version.outputs.tag }}
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          check-latest: true
          cache: false

      - name: Build
        run: |
          set -xeuo pipefail
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          LDFLAGS_SHARED=$(cat release/LDFLAGS)
          go build -v -trimpath -o "sing-box-${{ matrix.arch }}" -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: docker-binary-${{ matrix.arch }}
          path: sing-box-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs:
      - calculate_version
      - build_binary
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.calculate_version.outputs.tag }}
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: .
          pattern: docker-binary-*
          merge-multiple: true
      - name: Prepare binaries
        run: |
          chmod +x sing-box-*
          ls -la sing-box-*
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.binary
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ needs.calculate_version.outputs.tag }}
