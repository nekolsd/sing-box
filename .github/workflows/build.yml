name: Build

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g., v1.14.0-nekolsd)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION} (tag: ${TAG})"

  build_linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    needs: calculate_version
    strategy:
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.calculate_version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          check-latest: true
          cache: false

      - name: Clone cronet-go
        run: |
          set -xeuo pipefail
          CRONET_GO_VERSION=$(cat .github/CRONET_GO_VERSION)
          git init ~/cronet-go
          git -C ~/cronet-go remote add origin https://github.com/sagernet/cronet-go.git
          git -C ~/cronet-go fetch --depth=1 origin "$CRONET_GO_VERSION"
          git -C ~/cronet-go checkout FETCH_HEAD
          git -C ~/cronet-go submodule update --init --recursive --depth=1

      - name: Regenerate Debian keyring
        run: |
          set -xeuo pipefail
          rm -f ~/cronet-go/naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          cd ~/cronet-go
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh

      - name: Cache Chromium toolchain
        id: cache-chromium-toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/cronet-go/naiveproxy/src/third_party/llvm-build/
            ~/cronet-go/naiveproxy/src/gn/out/
            ~/cronet-go/naiveproxy/src/chrome/build/pgo_profiles/
            ~/cronet-go/naiveproxy/src/out/sysroot-build/
          key: chromium-toolchain-${{ matrix.arch }}-musl-${{ hashFiles('.github/CRONET_GO_VERSION') }}

      - name: Download Chromium toolchain
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain

      - name: Set Chromium toolchain environment
        run: |
          set -xeuo pipefail
          cd ~/cronet-go
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env >> $GITHUB_ENV

      - name: Build
        run: |
          set -xeuo pipefail
          TAGS="$(cat release/DEFAULT_BUILD_TAGS),with_v2ray_api,with_musl"
          LDFLAGS_SHARED=$(cat release/LDFLAGS)
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}

      - name: Archive
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-linux-${{ matrix.arch }}"
          cd dist
          mkdir "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}/"
          cp sing-box "${DIR_NAME}/"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}" sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-linux-${{ matrix.arch }}
          path: dist/

  build_darwin:
    name: Build Darwin binaries
    runs-on: macos-latest
    needs: calculate_version
    strategy:
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.calculate_version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          check-latest: true
          cache: false

      - name: Build
        run: |
          set -xeuo pipefail
          TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          LDFLAGS_SHARED=$(cat release/LDFLAGS)
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
            ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
      - name: Archive
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-darwin-${{ matrix.arch }}"
          cd dist
          mkdir "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}/"
          cp sing-box "${DIR_NAME}/"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}" sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-darwin-${{ matrix.arch }}
          path: dist/

  build_windows:
    name: Build Windows binaries
    runs-on: windows-latest
    needs: calculate_version
    strategy:
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          ref: ${{ needs.calculate_version.outputs.tag }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7
          check-latest: true
          cache: false

      - name: Build
        run: |
          $TAGS = Get-Content release/DEFAULT_BUILD_TAGS_WINDOWS
          $LDFLAGS_SHARED = Get-Content release/LDFLAGS
          New-Item -ItemType Directory -Force -Path dist
          go build -v -trimpath -o dist/sing-box.exe -tags "$TAGS" `
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' $LDFLAGS_SHARED -s -w -buildid=" `
            ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: ${{ matrix.arch }}

      - name: Extract libcronet.dll
        run: |
          $CRONET_GO_VERSION = (Get-Content .github/CRONET_GO_VERSION).Trim()
          $LIBRARY_PATH = "lib/windows_${{ matrix.arch }}/libcronet.dll"
          $CRONET_GO_DIR = Join-Path $env:RUNNER_TEMP "cronet-go-lib"
          git init "$CRONET_GO_DIR"
          git -C "$CRONET_GO_DIR" remote add origin https://github.com/sagernet/cronet-go.git
          git -C "$CRONET_GO_DIR" sparse-checkout set --no-cone "/$LIBRARY_PATH"
          git -C "$CRONET_GO_DIR" fetch --depth=1 --filter=blob:none origin "$CRONET_GO_VERSION"
          git -C "$CRONET_GO_DIR" checkout FETCH_HEAD
          Copy-Item "$CRONET_GO_DIR/$LIBRARY_PATH" dist

      - name: Archive
        run: |
          $DIR_NAME = "sing-box-${{ needs.calculate_version.outputs.version }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$DIR_NAME"
          Copy-Item LICENSE "dist/$DIR_NAME/"
          Copy-Item "dist/sing-box.exe" "dist/$DIR_NAME/"
          Copy-Item "dist/libcronet.dll" "dist/$DIR_NAME/"
          Compress-Archive -Path "dist/$DIR_NAME" -DestinationPath "dist/$DIR_NAME.zip"
          Remove-Item -Recurse "dist/$DIR_NAME"
          Remove-Item "dist/sing-box.exe"
          Remove-Item "dist/libcronet.dll"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-windows-${{ matrix.arch }}
          path: dist/

  upload:
    name: Upload to release
    if: ${{ !failure() }}
    runs-on: ubuntu-latest
    needs:
      - calculate_version
      - build_linux
      - build_darwin
      - build_windows
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.calculate_version.outputs.tag }}
          name: ${{ needs.calculate_version.outputs.tag }}
          files: dist/*
